[project]
name = "jd-helper"
version = "0.1.dev0"
description = "Personal helper tool for my Johnny Decimal system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Reinout van Rees", email = "reinout@vanrees.org" },
]
keywords = []
# Get classifier strings from http://www.python.org/pypi?%3Aaction=list_classifiers
classifiers = ["Programming Language :: Python"]
dependencies = []

[project.urls]
homepage = "https://github.com/nens/jd-helper"

[dependency-groups]
# The "dev" group is automatically installed by uv. When using pip,
# do something like "pip install -e . --group test".
dev = ["pytest>=8.4.2", "pytest-cov>=6.3.0", "pytest-sugar>=1.1.1"]

# See https://nens-meta.readthedocs.io/en/latest/config-files.html
[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--cov --cov-fail-under=80"
# Debugging tests in vscode? Run pytest with "--no-cov", see
# https://pytest-cov.readthedocs.io/en/latest/debuggers.html

[tool.ruff]
# See https://docs.astral.sh/ruff/configuration/ for defaults.
target-version = "py312"

[tool.ruff.lint]
# Default select: ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "I", "UP", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["jd_helper"]

[tool.zest-releaser]
release = false
